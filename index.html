<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>THIS GOOSE BABY</title>
  <meta name="description" content="THIS GOOSE BABY — gallery space opening Fall 2026." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="handPrinted" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3 0.35" numOctaves="2" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="scattered" />
      <feGaussianBlur in="scattered" stdDeviation="1" result="softened" />
      <feComponentTransfer in="softened">
        <feFuncA type="linear" slope="12" intercept="-4.5" />
      </feComponentTransfer>
    </filter>
  </svg>

  <main class="hero">
    <video
      class="hero__video"
      poster="assets/video/ledder-poster.jpg"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="assets/video/ledder.mp4" type="video/mp4" />
    </video>

    <div class="hero__scrim"></div>

    <h1 class="hero__headline">
      <span class="hero__word hero__word--left">THIS</span>
      <span class="hero__word hero__word--center">GOOSE</span>
      <span class="hero__word hero__word--right">BABY</span>
    </h1>

    <div class="hero__footer">
      <p class="hero__subline">Opening Fall 2026</p>
      <p class="hero__address">
        Eisenbahnstraße 5<br />
        Berlin Kreuzberg
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
