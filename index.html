<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Studio Kolchina & Gordon</title>
  <meta name="description" content="Studio Kolchina & Gordon — studio space opening Fall 2026, Eisenbahnstraße 5, Berlin-Kreuzberg." />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Studio Kolchina & Gordon" />
  <meta property="og:description" content="Studio space opening Fall 2026, Eisenbahnstraße 5, Berlin-Kreuzberg." />
  <meta property="og:image" content="preview2.jpg" />
  <meta property="og:site_name" content="Studio Kolchina & Gordon" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Studio Kolchina & Gordon" />
  <meta name="twitter:description" content="Studio space opening Fall 2026, Eisenbahnstraße 5, Berlin-Kreuzberg." />
  <meta name="twitter:image" content="preview2.jpg" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <!--
      Hand-printed look for the animated ring text only (the footer text no
      longer uses this effect). feTurbulence is swapped for a pre-baked
      feImage texture (written by marquee.js): Safari recomputes
      feTurbulence's Perlin noise from scratch on every paint even though a
      fixed seed makes its output identical every time — that's the actual
      cost behind the ring's stutter, not the displacement/blur/alpha steps.
      Baking it once per layout and sampling a bitmap instead removes that
      redundant per-frame work.
    -->
    <filter id="handPrintedRing" x="0" y="0" width="0" height="0" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feImage id="ringNoise" result="noise" x="0" y="0" width="0" height="0" preserveAspectRatio="none" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="scattered" />
      <feGaussianBlur in="scattered" stdDeviation="0.5" result="softened" />
      <feComponentTransfer in="softened">
        <feFuncA type="linear" slope="18" intercept="-7" />
      </feComponentTransfer>
    </filter>
  </svg>

  <main class="hero">
    <img class="hero__poster" src="assets/video/ledder-poster.jpg" alt="" aria-hidden="true" />
    <video
      class="hero__video"
      poster="assets/video/ledder-poster.jpg"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="assets/video/ledder.mp4" type="video/mp4" />
    </video>

    <div class="hero__scrim"></div>

    <h1 class="visually-hidden">Studio Kolchina &amp; Gordon</h1>

    <svg class="hero-marquee" aria-hidden="true" focusable="false">
      <defs>
        <path id="framePath"></path>
      </defs>
      <text id="frameMeasure" class="hero-marquee__text hero-marquee__measure"></text>
      <text class="hero-marquee__text">
        <textPath id="frameTextPath" xlink:href="#framePath" href="#framePath" startOffset="0%"></textPath>
      </text>
    </svg>

    <div class="hero__footer">
      <p class="hero__subline">opening fall 2026</p>
    </div>
  </main>

  <script src="marquee.js"></script>
  <script src="autoplay-fallback.js"></script>
</body>
</html>
