<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STUDIO KOLCHINA & GORDON</title>
  <meta name="description" content="STUDIO KOLCHINA & GORDON — gallery space opening Fall 2026, Eisenbahnstraße 5, Berlin Kreuzberg." />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="STUDIO KOLCHINA & GORDON" />
  <meta property="og:description" content="Gallery space opening Fall 2026, Eisenbahnstraße 5, Berlin Kreuzberg." />
  <meta property="og:image" content="preview.jpg" />
  <meta property="og:site_name" content="STUDIO KOLCHINA & GORDON" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="STUDIO KOLCHINA & GORDON" />
  <meta name="twitter:description" content="Gallery space opening Fall 2026, Eisenbahnstraße 5, Berlin Kreuzberg." />
  <meta name="twitter:image" content="preview.jpg" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="handPrinted" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3 0.35" numOctaves="1" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="scattered" />
      <feGaussianBlur in="scattered" stdDeviation="0.5" result="softened" />
      <feComponentTransfer in="softened">
        <feFuncA type="linear" slope="18" intercept="-7" />
      </feComponentTransfer>
    </filter>
  </svg>

  <main class="hero">
    <video
      class="hero__video"
      poster="assets/video/ledder-poster.jpg"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="assets/video/ledder.mp4" type="video/mp4" />
    </video>

    <div class="hero__scrim"></div>

    <h1 class="visually-hidden">STUDIO KOLCHINA &amp; GORDON</h1>

    <svg class="hero-marquee" aria-hidden="true" focusable="false">
      <defs>
        <path id="framePath"></path>
      </defs>
      <text id="frameMeasure" class="hero-marquee__text hero-marquee__measure"></text>
      <text class="hero-marquee__text">
        <textPath id="frameTextPath" xlink:href="#framePath" href="#framePath" startOffset="0%"></textPath>
      </text>
    </svg>

    <div class="hero__footer">
      <p class="hero__subline">Opening Fall 2026</p>
      <p class="hero__address">
        Eisenbahnstraße 5<br />
        Berlin-Kreuzberg
      </p>
    </div>
  </main>

  <script src="marquee.js"></script>
</body>
</html>
