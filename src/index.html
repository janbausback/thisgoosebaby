<body>

<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <!--
    Hand-printed look for the animated ring text. feTurbulence is swapped for a
    pre-baked feImage texture (written by marquee.js): Safari recomputes
    feTurbulence's Perlin noise from scratch on every paint even though a fixed
    seed makes its output identical every time — that's the actual cost behind
    the ring's stutter, not the displacement/blur/alpha steps. Baking it once
    per layout and sampling a bitmap instead removes that redundant work.
  -->
  <filter id="handPrintedRing" x="0" y="0" width="0" height="0" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
    <feImage id="ringNoise" result="noise" x="0" y="0" width="0" height="0" preserveAspectRatio="none" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="scattered" />
    <feGaussianBlur in="scattered" stdDeviation="0.5" result="softened" />
    <feComponentTransfer in="softened">
      <feFuncA type="linear" slope="18" intercept="-7" />
    </feComponentTransfer>
  </filter>
</svg>

<main class="hero">
  <!-- The poster is a plain <img> underneath, not just the <video poster>
       attribute, so it is on screen from first paint regardless of autoplay —
       JS fades the video in once it is truly playing. -->
  <img class="hero__poster" src="{{src:poster}}" srcset="{{srcset:poster}}"
       sizes="100vw" width="{{w:poster}}" height="{{h:poster}}" alt=""
       aria-hidden="true" fetchpriority="high" decoding="sync">
  <!-- No `loop`: the clip is a one-way reveal — the shutter rises to expose the
       lit interior — so it plays once and rests on the final open frame. -->
  <video class="hero__video" src="{{src:video}}" poster="{{src:poster}}"
         autoplay muted playsinline></video>

  <div class="hero__scrim"></div>

  <h1 class="visually-hidden">Studio Kolchina &amp; Gordon</h1>

  <svg class="hero-marquee" aria-hidden="true" focusable="false">
    <defs>
      <path id="framePath"></path>
    </defs>
    <text id="frameMeasure" class="hero-marquee__text hero-marquee__measure"></text>
    <text class="hero-marquee__text">
      <textPath id="frameTextPath" xlink:href="#framePath" href="#framePath" startOffset="0%"></textPath>
    </text>
  </svg>

  <div class="hero__footer">
    <p class="hero__label">09. – 30. September</p>
    <a class="hero__link" href="/zwischentoene.html">Zwischentöne</a>
  </div>
</main>

</body>
</html>
