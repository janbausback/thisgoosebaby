  <!--
    Hand-printed look for the marquee: noise displaces the glyph edges a
    fraction of a pixel, a blur and an alpha threshold re-cut them rough.
    marquee.js sizes the region; feTile repeats the noise once per half of the
    track so the texture loops with the text. The track moves as a composited
    layer, so this runs once per layout — not on every frame, which is what
    made the old ring stutter in Safari and forced its noise to be pre-baked.
  -->
  <filter id="handPrinted" x="0" y="0" width="0" height="0" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
    <feTurbulence id="handPrintedNoise" type="fractalNoise" baseFrequency="0.3 0.35" numOctaves="1" seed="7" stitchTiles="stitch" x="0" y="0" width="0" height="0" result="tile" />
    <feTile in="tile" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="scattered" />
    <feGaussianBlur in="scattered" stdDeviation="0.5" result="softened" />
    <feComponentTransfer in="softened">
      <feFuncA type="linear" slope="18" intercept="-7" />
    </feComponentTransfer>
  </filter>
</svg>
